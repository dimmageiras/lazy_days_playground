name: lazy_days_playground

services:
  gel_db:
    image: geldata/gel:7.1
    environment:
      GEL_SERVER_ADMIN_UI: enabled
      GEL_SERVER_PASSWORD: ${VITE_APP_DB_PASSWORD}
      GEL_SERVER_SECURITY: ${VITE_APP_DB_SERVER_SECURITY}
    ports:
      - "${VITE_APP_DB_PORT}:5656"
    volumes:
      - gel_data:/var/lib/gel/data

volumes:
  gel_data: {}
