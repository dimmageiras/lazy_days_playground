name: Accept merged ADRs

on:
  pull_request:
    types: [closed]

concurrency:
  group: accept-adrs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  accept-adrs:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'adr/accept-pr-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the base branch (post-merge state)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Flip touched Proposed ADRs to Accepted
        id: flip
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          echo "today=${today}" >> "$GITHUB_OUTPUT"

          : > /tmp/accepted-adrs.txt

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > /tmp/pr-files.txt

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            [[ "$file" =~ ^docs/adr/[0-9]{4}-.*\.md$ ]] || continue
            [[ -f "$file" ]] || continue
            rc=0
            grep -qE '^- \*\*Status:\*\* Proposed' "$file" || rc=$?
            [[ "$rc" -eq 1 ]] && continue
            [[ "$rc" -eq 0 ]] || exit "$rc"

            sed -i -E \
              -e 's/^- \*\*Status:\*\* Proposed/- **Status:** Accepted/' \
              -e "s/^- \*\*Date:\*\* .*/- **Date:** ${today}/" \
              "$file"
            echo "$file" >> /tmp/accepted-adrs.txt
          done < /tmp/pr-files.txt

          if [[ ! -s /tmp/accepted-adrs.txt ]]; then
            echo "No touched Proposed ADRs — nothing to accept."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the follow-up PR
        if: steps.flip.outputs.changed == 'true'
        env:
          TODAY: ${{ steps.flip.outputs.today }}
        run: |
          set -euo pipefail

          branch="adr/accept-pr-${PR_NUMBER}"

          if [[ -n "$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')" ]]; then
            echo "A follow-up PR for source #${PR_NUMBER} already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/adr/

          if git diff --cached --quiet; then
            echo "No staged ADR changes — nothing to commit."
            exit 0
          fi

          git commit -m "docs(adr): accept ADRs merged in #${PR_NUMBER}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$branch"

          {
            echo "Auto-generated after #${PR_NUMBER} merged into \`${BASE_REF}\`."
            echo
            echo "Flips the following ADRs from **Proposed** to **Accepted** (Date set to ${TODAY}):"
            echo
            sed 's/^/- /' /tmp/accepted-adrs.txt
            echo
            echo "Merge this if the decision is now in force. If an ADR is forward-looking — its enforcement waits for a later implementation slice (see \`docs/adr/README.md\` lifecycle) — close this PR instead of merging it."
          } > /tmp/pr-body.md

          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "docs(adr): accept ADRs merged in #${PR_NUMBER}" \
            --body-file /tmp/pr-body.md
